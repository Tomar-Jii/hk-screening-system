version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sih_backend_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./screening_authority.db
    volumes:
      - ./sample_data:/app/sample_data

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: sih_officer_dashboard
    ports:
      - "3000:80"
    depends_on:
      - backend
