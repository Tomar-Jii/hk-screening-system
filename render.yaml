services:
  # ----------------------------------------------------------------------------
  # 1. FastAPI Backend Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: sih-document-screening-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: sih-screening-db
          property: connectionString

  # ----------------------------------------------------------------------------
  # 2. React Frontend Static Site
  # ----------------------------------------------------------------------------
  - type: web
    name: sih-document-screening-frontend
    runtime: static
    
    plan: free
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: sih-document-screening-backend
          property: host

# ------------------------------------------------------------------------------
# 3. Managed PostgreSQL Database
# ------------------------------------------------------------------------------
databases:
  - name: sih-screening-db
    plan: free
    region: oregon
    databaseName: screening_authority
    user: screening_admin
